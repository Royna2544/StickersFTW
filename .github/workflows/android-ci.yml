name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # libwebp is a submodule and the native build cannot start without
          # it -- CMake fails with an explicit message rather than something
          # cryptic, but it still fails.
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner image ships some NDK and no SDK CMake, and Gradle cannot
      # accept licences for packages it installs itself. Installing the exact
      # pinned NDK up front is also what keeps CI honest about 16KB alignment:
      # r28+ links that way by default.
      - name: Install NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "ndk;30.0.14904198" "cmake;3.22.1"

      - name: Make gradlew executable
        run: chmod +x gradlew

      # This exercises the conversion implementation as ordinary host C. It
      # deliberately does not boot ART, an emulator, or the Android runtime.
      - name: Run ART-free native tests
        run: |
          CMAKE="$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          "$CMAKE" -S app/src/main/cpp -B build/stickerwebp-host \
            -DSTICKERSFTW_BUILD_NATIVE_TESTS=ON
          "$CMAKE" --build build/stickerwebp-host --target stickerwebp_core_test
          "$ANDROID_HOME/cmake/3.22.1/bin/ctest" \
            --test-dir build/stickerwebp-host --output-on-failure

      - name: Run unit tests
        run: ./gradlew :conversion-core:test :app:testDebugUnitTest

      - name: Run lint
        run: ./gradlew lintDebug

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      # Guards the fix that replaced a prebuilt WebP AAR whose .so files were
      # linked at 4KB. A dependency can put that back without touching our
      # code, and the only symptom would be the app dying on a 16KB device.
      - name: Check native library alignment
        run: python3 tools/check_native_alignment.py app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test/lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            conversion-core/build/reports/tests/test
            app/build/reports/lint-results-debug.html
