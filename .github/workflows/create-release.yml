name: Create release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "New tag, e.g. v1.1"
        required: true
        type: string
      old_tag:
        description: "Previous tag the changelog starts from. Defaults to the latest existing tag, or the repo root if there are none."
        required: false
        type: string

# Bumping the version commits to master and creates a tag, and the release
# itself needs to be written.
permissions:
  contents: write

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          # Full history and tags: the changelog range and the default
          # old_tag both need them, and a shallow clone has neither.
          fetch-depth: 0
          submodules: recursive

      # Checked before anything is committed or tagged, so a missing secret
      # cannot leave master bumped and tagged for a release that was never
      # built. An unsigned APK is not installable, so shipping one would be
      # worse than failing here.
      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. This workflow needs KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD as repository secrets."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "ndk;30.0.14904198" "cmake;3.22.1"

      - name: Resolve changelog range
        id: range
        env:
          OLD_TAG: ${{ inputs.old_tag }}
        run: |
          if [ -n "$OLD_TAG" ]; then
            if ! git rev-parse -q --verify "refs/tags/$OLD_TAG" > /dev/null; then
              echo "::error::old_tag '$OLD_TAG' does not exist"
              exit 1
            fi
            FROM="$OLD_TAG"
          elif FROM=$(git describe --tags --abbrev=0 2>/dev/null); then
            echo "No old_tag given; using the latest tag $FROM"
          else
            FROM=$(git rev-list --max-parents=0 HEAD | tail -1)
            echo "No tags in the repo; starting from the root commit $FROM"
          fi
          echo "from=$FROM" >> "$GITHUB_OUTPUT"

      - name: Bump version and tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error::tag '$TAG' already exists"
            exit 1
          fi
          python3 tools/bump_version.py "$TAG" | tee -a "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "Release $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin master
          git push origin "$TAG"

      - name: Write signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # Written by the runner, never committed; keystore.properties is
          # gitignored and the runner is discarded after the job.
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Check native library alignment
        run: python3 tools/check_native_alignment.py app/build/outputs/apk/release/app-release.apk

      - name: Verify the APK is signed
        env:
          TAG: ${{ inputs.tag }}
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/StickersFTW-$TAG.apk"

      - name: Write release notes
        id: notes
        env:
          TAG: ${{ inputs.tag }}
          FROM: ${{ steps.range.outputs.from }}
        run: |
          {
            echo "## Changes"
            echo
            git log --no-merges --reverse --pretty=format:'- `%h` %s' "$FROM..$TAG"
            echo
            echo
            echo "Built from \`$(git rev-parse --short "$TAG"^{commit})\` · versionCode \`$versionCode\`"
          } > notes.md
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file notes.md \
            "dist/StickersFTW-$TAG.apk"

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
